{% extends "base.html" %}

{% block content %}
<div>
    <!-- Config Group List (Server Mode, no config group selected) -->
    <template x-if="initialized && serverMode && !currentConfigGroup">
        <div class="card">
            <div class="card-header">
                <i class="fas fa-folder me-2"></i>Select a config group
            </div>
            <div class="card-body">
                <p class="text-muted mb-0" x-show="configGroupsByProject.length === 0">No config groups available.</p>
                <template x-for="entry in configGroupsByProject" :key="entry.project">
                    <div class="mb-3">
                        <h6 x-text="entry.project"></h6>
                        <div class="list-group">
                            <template x-for="group in entry.groups" :key="group">
                                <a class="list-group-item list-group-item-action"
                                   href="#"
                                   @click.prevent="window.serverModeManager.setCurrentConfigGroup(group)"
                                   x-text="group.split('/')[1]"></a>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </template>

    <!-- Status Section - hidden in server mode, only render after initialization -->
    <template x-if="initialized && activeConfig === 'status' && !serverMode">
        <div>
            {% include 'status.html' %}
        </div>
    </template>

    <!-- Live Section - hidden in server mode: there is no local broker there -->
    <template x-if="initialized && activeConfig === 'live' && !serverMode">
        <div>
            {% include 'live.html' %}
        </div>
    </template>

    <!-- System Settings Section -->
    <div x-show="activeConfig === 'settings' && isSettingsAvailable()" x-cloak>
        <template x-if="activeConfig === 'settings' && isSettingsAvailable()">
            <div>
                {% include 'settings.html' %}
            </div>
        </template>
    </div>

    <!-- Radio Tracking Section -->
    {% if 'radiotracking' in available_services %}
    <div x-show="activeConfig === 'radiotracking' && isServiceAvailable('radiotracking')" x-cloak>
        <template x-if="activeConfig === 'radiotracking' && isServiceAvailable('radiotracking')">
            <div>
                {% include 'radiotracking.html' %}
            </div>
        </template>
    </div>
    {% endif %}

    <!-- Soundscapepipe Section -->
    {% if 'soundscapepipe' in available_services %}
    <div x-show="activeConfig === 'soundscapepipe' && isServiceAvailable('soundscapepipe')" x-cloak>
        <template x-if="activeConfig === 'soundscapepipe' && isServiceAvailable('soundscapepipe')">
            <div>
                {% include 'soundscapepipe.html' %}
            </div>
        </template>
    </div>
    {% endif %}
</div>
{% endblock %}

<!-- What the live charts share: warnings, the chart with its tooltip, the legend and the count.
     Expects the scope of a component with liveChartMixin. -->
<div class="alert alert-warning py-2" x-show="clockOff || skipped > 0" x-cloak>
    <i class="fas fa-clock me-1"></i>
    <span x-show="clockOff">
        The latest <span x-text="noun"></span> arrived <span x-text="delayText"></span>:
        the station's clock differs from this browser's, or detections are delayed.
    </span>
    <span x-show="skipped > 0">
        <span x-text="skipped"></span> <span x-text="noun"></span><span x-show="skipped !== 1">s</span> not drawn: their time
        is more than <span x-text="windowMinutes"></span> minutes behind or 10 minutes ahead of this browser's clock.
    </span>
</div>
<div class="alert alert-danger py-2" x-show="error && status !== 'connected'" x-cloak>
    <i class="fas fa-exclamation-triangle me-1"></i>
    <span x-text="error"></span>
</div>

<div class="live-axis-title small text-muted" x-text="yLabel"></div>
<div class="live-chart-wrap position-relative">
    <div x-ref="chart" class="live-chart"></div>
    <div class="live-tooltip small shadow-sm" x-show="tip" x-cloak
         :style="tip ? (tip.flip ? `left: ${tip.left - 12}px; transform: translateX(-100%); top: ${tip.top + 12}px` : `left: ${tip.left + 12}px; top: ${tip.top + 12}px`) : ''">
        <template x-if="tip">
            <div>
                <div class="fw-bold" x-text="tip.title"></div>
                <template x-for="row in tip.rows" :key="row.text">
                    <div>
                        <i class="fas fa-circle me-1" x-show="row.color" :style="`color: ${row.color}`"></i>
                        <span x-text="row.text"></span>
                    </div>
                </template>
            </div>
        </template>
    </div>
</div>

<div class="live-legend small mt-2" x-show="legend.length > 0" x-cloak>
    <template x-for="item in legend" :key="item.key">
        <span class="text-nowrap">
            <i class="fas fa-circle me-1" :style="`color: ${item.color}`"></i><span x-text="item.label"></span>
        </span>
    </template>
</div>

<p class="live-count small text-muted mb-0 mt-2">
    <span x-text="count"></span> <span x-text="noun"></span><span x-show="count !== 1">s</span>
    in the last <span x-text="viewText"></span>
    <span x-show="offsetMs !== null">&middot; latest arrived <span x-text="delayText"></span></span>
</p>

            <!-- Power: one card per charge controller daemon with recent readings
                 (each card hides itself, so the row is empty on systems without one) -->
            <div class="row">
                {% for source in ['smartsolar', 'solarlife'] %}
                <div class="col-12 mt-4" x-data="powerSummary('{{ source }}')" x-show="powerBlock" x-cloak>
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5 class="card-title mb-0">
                                <i class="fas fa-solar-panel me-2"></i>Power · <span x-text="title"></span>
                            </h5>
                            <div class="d-flex align-items-center gap-2">
                                <small class="text-muted" x-text="powerBlock ? `${Math.round(powerBlock.age_s)} s ago` : ''"></small>
                                <button class="btn btn-outline-primary btn-sm"
                                        @click="readNow()"
                                        :disabled="powerReading"
                                        title="Read the values from the charge controller now">
                                    <i class="fas fa-sync-alt me-1" :class="{ 'fa-spin': powerReading }"></i>
                                    <span x-text="powerReading ? 'Reading...' : 'Refresh'"></span>
                                </button>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <template x-for="group in powerGroups" :key="group.title">
                                    <div class="col-lg-3 col-md-6">
                                        <h6 class="text-muted mb-3"><i class="fas me-2" :class="group.icon"></i><span x-text="group.title"></span></h6>
                                        <table class="table table-borderless table-sm small">
                                            <tbody>
                                                <template x-for="item in group.values" :key="item.name">
                                                    <tr>
                                                        <td class="fw-bold" x-text="`${item.friendly}:`"></td>
                                                        <td class="text-end">
                                                            <span class="badge small text-bg-primary" x-text="formatPowerValue(item)"></span>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </template>
                            </div>
                            <template x-if="powerReadError">
                                <div class="text-danger small">
                                    <i class="fas fa-exclamation-triangle me-1"></i>
                                    <span x-text="powerReadError"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>

<!-- Passages -->
<div class="row mb-4">
    <div class="col" x-data="liveLbPassages()">
        <div class="card">
            <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
                <h5 class="card-title mb-0">
                    <i class="fas fa-door-open me-2"></i>Passages
                </h5>
                {% include 'partials/live_status_badge.html' %}
            </div>
            <div class="card-body">
                <p class="small text-muted">
                    A dot per passage at its start, as high as it took from the first block to the last unblock,
                    in the colour of its direction. lightbarrierd publishes each passage as it ends.
                </p>

                {% include 'partials/live_chart.html' %}
            </div>
        </div>
    </div>
</div>

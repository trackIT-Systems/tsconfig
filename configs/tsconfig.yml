# Systemd services configuration
# Set expert: true for services that should only be visible in expert mode

# Configuration file locations
file_locations:
  config_dir: "/boot/firmware"  # Default location for radiotracking.ini and schedule.yml

# System settings
system:
  status_refresh_interval: 5  # Default system status refresh interval in seconds

# Map on the status page: satellite imagery from Mapbox with this public
# (pk.) token, restricted to our URLs in the Mapbox account. Without a token
# the map shows OpenStreetMap.
map:
  mapbox_token: "pk.eyJ1IjoidHJhY2tpdHN5c3RlbXMiLCJhIjoiY21iaHEwbXcwMDEzcTJqc2JhNzdobDluaSJ9.NLRmiJEDHQgPJEyceCA57g"

# Feature flags
features:
  audioprotopnet: false  # set true to enable AudioProtoPNet detector UI

services:
  - name: multi-user.target
    expert: true
  - name: radiotracking
    expert: false 
  - name: soundscapepipe
    expert: false
  - name: time-sync.target
    expert: true
  - name: tsschedule
    expert: false
  - name: chrony
    expert: true
  - name: mqttutil
    expert: true 
  - name: mosquitto
    expert: true
  - name: solarlife
    expert: true
  - name: smartsolar
    expert: true
  - name: tsupdate
    expert: true
  - name: tsconfig
    expert: true
  - name: tsconfig-ble
    expert: true
  - name: bluetooth
    expert: true
  - name: ssh
    expert: true
  - name: wg-quick@wireguard
    expert: true
  - name: NetworkManager
    expert: true
  - name: ModemManager
    expert: true
  - name: wificheck
    expert: true    
  - name: huaweicheck
    expert: true
  - name: dmesg
    expert: true

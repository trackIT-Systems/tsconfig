# tstelemetry, installed as /etc/tsconfig/tstelemetry.yml: what is published as <hostname>/tsconfig/<collector>/{csv,json,cbor}
# and written to <files.path>/<hostname>/tsconfig/<collector>/<hostname>_<date>_<collector>.csv.
# Every key is optional; a missing key (or file) means the default shown here.
# Intervals are in seconds, aligned to the clock (60 = every full minute).
broker:
  host: 127.0.0.1
  port: 1883
# MQTT payload formats; an empty list publishes nothing over MQTT
formats:
- csv
- json
- cbor
files:
  enabled: true
  path: /data
collectors:
  system:
    enabled: true
    interval: 60
  thermal:
    enabled: true
    interval: 60
  disk:
    enabled: true
    interval: 60
    mounts:
    - /
    - /data
  pmic:
    enabled: true
    interval: 60
  throttled:
    enabled: true
    interval: 60
  clocks:
    enabled: true
    interval: 60
  voltages:
    enabled: true
    interval: 60
  wittypi:
    enabled: true
    interval: 60
  network:
    enabled: true
    interval: 600
    interfaces:
    - wireguard
    - eth0
    - wlan0
    - wwan0
  modem:
    enabled: true
    interval: 3600
  configs:
    enabled: true
    interval: 3600
  release:
    enabled: true
    interval: 3600
  # Entries and dropped entries per unit and level of the journal source below
  journalstats:
    enabled: true
    interval: 600
# Journal entries, published as <hostname>/tsconfig/journal/<unit>/<level>/{csv,json,cbor} (MQTT only).
# The MQTT bridge selects which units and levels leave the station; see tsOS-base docs/logging.md.
journal:
  enabled: true
  # The lowest level published: emerg, alert, crit, err, warning, notice or info (debug never is)
  level: info
  # Limits for every level, counted per level
  limits:
    # Seconds in which the same unit, level and message is sent once; a count of the repeats follows
    repeat_window: 600
    # Entries per unit sent at once, then one every `rate` seconds
    burst: 10
    rate: 60
    # Entries per hour for the whole station
    budget: 100
    # Characters per message; a traceback keeps its first and last line
    max_length: 256
  # Limits of single levels that differ, e.g.
  #   info:
  #     budget: 50
  levels: {}

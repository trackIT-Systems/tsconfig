name: Build and Push Docker Image

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  workflow_dispatch:

# The image is built once and pushed to ghcr. The zot-copy job then copies it
# from ghcr to zot by digest, so a slow or broken zot can't hold up the ghcr push.
env:
  IMG: tsconfig

jobs:
  tsconfig:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.bare.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/trackit-systems/${{ env.IMG }}
          # latest only on release tags, not on test or pre-release tags (0.0.0-registry-test)
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}

      - name: Build and push ${{ github.job }} image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          provenance: false
          sbom: false

      - name: Bare tags for the zot copy
        id: bare
        env:
          REFS: ${{ steps.meta.outputs.tags }}
        run: echo "tags=$(for r in $REFS; do echo "${r##*:}"; done | xargs)" >> "$GITHUB_OUTPUT"

  zot-copy:
    needs: tsconfig
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: read
    env:
      DIGEST: ${{ needs.tsconfig.outputs.digest }}
      TAGS: ${{ needs.tsconfig.outputs.tags }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to ZOT Registry
        uses: docker/login-action@v4
        with:
          registry: registry.trackit.systems
          username: ${{ secrets.ZOT_ROBOT_USER }}
          password: ${{ secrets.ZOT_ROBOT_TOKEN }}

      - name: Copy from ghcr to zot and check digests
        run: |
          set -euo pipefail
          src="ghcr.io/trackit-systems/${IMG}@${DIGEST}"
          for t in $TAGS; do
            for delay in 30 120 300 end; do
              docker buildx imagetools create --prefer-index=false -t "registry.trackit.systems/backend/${IMG}:${t}" "$src" && break
              [ "$delay" = end ] && { echo "::error::copy to zot failed for ${t}"; exit 1; }
              echo "retry in ${delay}s"; sleep "$delay"
            done
          done
          for t in $TAGS; do
            for ref in "ghcr.io/trackit-systems/${IMG}:${t}" "registry.trackit.systems/backend/${IMG}:${t}"; do
              got=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
              [ "$got" = "$DIGEST" ] || { echo "::error::$ref is $got, expected $DIGEST"; exit 1; }
            done
          done
